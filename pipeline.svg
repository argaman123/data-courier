<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
  :root { --ink: #1f2328; --muted: #59636e; --uses: #8c959f; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e6edf3; --muted: #9198a1; --uses: #6e7681; } }
  .on { fill: #fff; font-size: 11px; }
  .ink { fill: var(--ink); font-size: 11px; }
  .name { font-size: 13px; font-weight: 600; }
  .desc { opacity: .9; }
  .title { fill: #8250df; font-size: 11px; font-weight: 600; }
  .side { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; }
  .legend { fill: var(--ink); font-size: 12px; }
  .edge-label { fill: var(--muted); font-size: 11px; }
  .frame { fill: none; stroke: #8250df; stroke-width: 1.5; stroke-dasharray: 6 4; }
  .frame.back { opacity: .45; }
  .edge { fill: none; stroke: var(--ink); stroke-width: 1.5; }
  .edge.uses { stroke: var(--uses); }
  .edge.disk { stroke-dasharray: 2 3; }
  .edge.net { stroke-width: 3; stroke-dasharray: 9 5; }
  .packet { fill: none; stroke: var(--ink); stroke-width: 1.5; }
  .diode { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 4; }
  .rule { stroke: var(--uses); stroke-width: .5; }
  #head path { fill: var(--ink); }
  #head-uses path { fill: var(--uses); }
</style>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z"/></marker>
  <marker id="head-uses" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 Z"/></marker>
</defs>
<text class="side" x="20" y="22">SEND SIDE</text>
<text class="side" x="980" y="22" text-anchor="end">RECEIVE SIDE</text>
<line class="diode" x1="500" y1="10" x2="500" y2="372"/>
<text class="side" x="500" y="22" text-anchor="middle">DATA DIODE</text>
<g transform="translate(0 20)">
<rect class="frame" x="215" y="128" width="205" height="92" rx="10"/>
<text class="title" x="227" y="145">Main process</text>
<rect class="frame back" x="225" y="252" width="205" height="200" rx="10"/>
<rect class="frame back" x="220" y="257" width="205" height="200" rx="10"/>
<rect class="frame" x="215" y="262" width="205" height="200" rx="10"/>
<text class="title" x="227" y="279">Processor process, per folder</text>
<path d="M40,82 V34 Q40,30 44,30 H78 L86,38 H156 Q160,38 160,42 V82 Q160,86 156,86 H44 Q40,86 40,82 Z" fill="#64748b"/>
<text class="on" x="100.0" y="66.0" text-anchor="middle"><tspan class="name">Temp folder</tspan></text>
<path d="M258,74 V26 Q258,22 262,22 H296 L304,30 H384 Q388,30 388,34 V74 Q388,78 384,78 H262 Q258,78 258,74 Z" fill="#64748b" opacity="0.35"/>
<path d="M254,78 V30 Q254,26 258,26 H292 L300,34 H380 Q384,34 384,38 V78 Q384,82 380,82 H258 Q254,82 254,78 Z" fill="#64748b" opacity="0.6"/>
<path d="M250,82 V34 Q250,30 254,30 H288 L296,38 H376 Q380,38 380,42 V82 Q380,86 376,86 H254 Q250,86 250,82 Z" fill="#64748b"/>
<text class="on" x="315.0" y="58.0" text-anchor="middle"><tspan class="name">Input folders</tspan></text>
<text class="on desc" x="315.0" y="74.0" text-anchor="middle">any number</text>
<rect x="235" y="150" width="165" height="56" rx="6" fill="#1ba1e2"/>
<text class="on" x="317.5" y="174.0" text-anchor="middle"><tspan class="name">Scanner</tspan></text>
<text class="on desc" x="317.5" y="190.0" text-anchor="middle">picks up finished files</text>
<rect x="25" y="150" width="150" height="56" rx="28.0" fill="#f26b0f"/>
<text class="on" x="100.0" y="174.0" text-anchor="middle"><tspan class="name">File</tspan></text>
<text class="on desc" x="100.0" y="190.0" text-anchor="middle">buffers bytes and header</text>
<rect x="25" y="290" width="150" height="56" rx="28.0" fill="#f26b0f"/>
<text class="on" x="100.0" y="314.0" text-anchor="middle"><tspan class="name">Encoder</tspan></text>
<text class="on desc" x="100.0" y="330.0" text-anchor="middle">generates FEC packets</text>
<rect x="235" y="290" width="165" height="56" rx="6" fill="#6a00ff"/>
<text class="on" x="317.5" y="314.0" text-anchor="middle"><tspan class="name">Processor</tspan></text>
<text class="on desc" x="317.5" y="330.0" text-anchor="middle">turns files into packets</text>
<rect x="235" y="390" width="165" height="56" rx="6" fill="#1ba1e2"/>
<text class="on" x="317.5" y="414.0" text-anchor="middle"><tspan class="name">Sender</tspan></text>
<text class="on desc" x="317.5" y="430.0" text-anchor="middle">paces the packets out</text>
<path class="edge disk" d="M315,86 V148" marker-end="url(#head)"/>
<text class="edge-label" x="323" y="124" text-anchor="start">stable files</text>
<path class="edge disk" d="M235,170 H205 V58 H162" marker-end="url(#head)"/>
<text class="edge-label" x="199" y="124" text-anchor="end">moves</text>
<path class="edge disk" d="M100,86 V148" marker-end="url(#head)"/>
<text class="edge-label" x="107" y="124" text-anchor="start">file bytes</text>
<path class="edge uses" d="M100,290 V208" marker-end="url(#head-uses)"/>
<path class="edge uses" d="M235,318 H177" marker-end="url(#head-uses)"/>
<path class="edge queue" d="M315,206 V288" marker-end="url(#head)"/>
<text class="edge-label" x="323" y="241" text-anchor="start">file names</text>
<path class="edge queue" d="M315,346 V388" marker-end="url(#head)"/>
<text class="edge-label" x="323" y="372" text-anchor="start">packets</text>
<path class="edge net" d="M400,418 H452" marker-end="url(#head)"/>
<path class="packet" d="M500,373 L545,418 L500,463 L455,418 Z"/>
<text class="ink" x="500" y="414" text-anchor="middle"><tspan class="name">Packet</tspan></text>
<text class="ink desc" x="500" y="430" text-anchor="middle">UDP</text>
<path class="edge net" d="M545,418 H688" marker-end="url(#head)"/>
<rect class="frame" x="532" y="128" width="458" height="236" rx="10"/>
<text class="title" x="544" y="145">Processor process</text>
<path d="M698,74 V26 Q698,22 702,22 H736 L744,30 H834 Q838,30 838,34 V74 Q838,78 834,78 H702 Q698,78 698,74 Z" fill="#64748b" opacity="0.35"/>
<path d="M694,78 V30 Q694,26 698,26 H732 L740,34 H830 Q834,34 834,38 V78 Q834,82 830,82 H698 Q694,82 694,78 Z" fill="#64748b" opacity="0.6"/>
<path d="M690,82 V34 Q690,30 694,30 H728 L736,38 H826 Q830,38 830,42 V82 Q830,86 826,86 H694 Q690,86 690,82 Z" fill="#64748b"/>
<text class="on" x="760.0" y="58.0" text-anchor="middle"><tspan class="name">Output folders</tspan></text>
<text class="on desc" x="760.0" y="74.0" text-anchor="middle">mirror the inputs</text>
<rect x="690" y="150" width="140" height="56" rx="6" fill="#1ba1e2"/>
<text class="on" x="760.0" y="174.0" text-anchor="middle"><tspan class="name">Writer</tspan></text>
<text class="on desc" x="760.0" y="190.0" text-anchor="middle">saves complete files</text>
<rect x="880" y="150" width="100" height="56" rx="6" fill="#1ba1e2"/>
<text class="on" x="930.0" y="174.0" text-anchor="middle"><tspan class="name">RabbitMQ</tspan></text>
<text class="on desc" x="930.0" y="190.0" text-anchor="middle">publishes paths</text>
<rect x="545" y="290" width="120" height="56" rx="6" fill="#1ba1e2"/>
<text class="on" x="605.0" y="314.0" text-anchor="middle"><tspan class="name">Cleaner</tspan></text>
<text class="on desc" x="605.0" y="330.0" text-anchor="middle">drops stale files</text>
<rect x="690" y="290" width="140" height="56" rx="6" fill="#6a00ff"/>
<text class="on" x="760.0" y="314.0" text-anchor="middle"><tspan class="name">Processor</tspan></text>
<text class="on desc" x="760.0" y="330.0" text-anchor="middle">collects packets</text>
<rect x="690" y="390" width="140" height="56" rx="6" fill="#6a00ff"/>
<text class="on" x="760.0" y="414.0" text-anchor="middle"><tspan class="name">Receiver</tspan></text>
<text class="on desc" x="760.0" y="430.0" text-anchor="middle">listens for packets</text>
<rect x="860" y="390" width="130" height="56" rx="28.0" fill="#f26b0f"/>
<text class="on" x="925.0" y="414.0" text-anchor="middle"><tspan class="name">PartialFile</tspan></text>
<text class="on desc" x="925.0" y="430.0" text-anchor="middle">decodes FEC packets</text>
<path class="edge queue" d="M760,390 V348" marker-end="url(#head)"/>
<text class="edge-label" x="768" y="381" text-anchor="start">shared memory</text>
<path class="edge queue" d="M760,290 V208" marker-end="url(#head)"/>
<text class="edge-label" x="768" y="252" text-anchor="start">complete files</text>
<path class="edge disk" d="M760,150 V88" marker-end="url(#head)"/>
<text class="edge-label" x="768" y="124" text-anchor="start">writes</text>
<path class="edge queue" d="M830,178 H878" marker-end="url(#head)"/>
<text class="edge-label" x="854" y="171" text-anchor="middle">paths</text>
<path class="edge uses" d="M665,318 H688" marker-end="url(#head-uses)"/>
<path class="edge uses" d="M830,318 H925 V388" marker-end="url(#head-uses)"/>
</g>
<line class="rule" x1="20" y1="515" x2="980" y2="515"/>
<rect x="20" y="535" width="28" height="20" rx="4" fill="#6a00ff"/>
<text class="legend" x="56" y="549">Process</text>
<rect x="142" y="535" width="28" height="20" rx="4" fill="#1ba1e2"/>
<text class="legend" x="178" y="549">Thread</text>
<rect x="264" y="535" width="28" height="20" rx="10" fill="#f26b0f"/>
<text class="legend" x="300" y="549">Class</text>
<path d="M386,555 V537 Q386,535 388,535 H396 L399,538 H412 Q414,538 414,540 V555 Z" fill="#64748b"/>
<text class="legend" x="422" y="549">Folder</text>
<path class="edge queue" d="M508,545 H534" marker-end="url(#head)"/>
<text class="legend" x="544" y="549">Queue</text>
<path class="edge uses" d="M630,545 H656" marker-end="url(#head-uses)"/>
<text class="legend" x="666" y="549">Uses</text>
<path class="edge disk" d="M752,545 H778" marker-end="url(#head)"/>
<text class="legend" x="788" y="549">Disk access</text>
<path class="edge net" d="M874,545 H900" marker-end="url(#head)"/>
